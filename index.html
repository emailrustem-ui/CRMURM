<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRM УРМ</title>
<script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#eef1f7;--card:#fff;--ink:#1c2333;--mut:#6b7280;--blue:#1b5ea8;--blue2:#17497f;--rad:14px;--sh:0 2px 10px rgba(20,30,60,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:14px}
.card{background:var(--card);border-radius:var(--rad);box-shadow:var(--sh);padding:16px;margin-bottom:14px}
h1,h2,h3{margin:.2em 0 .5em}h1{font-size:22px}h2{font-size:18px}h3{font-size:16px}
.mut{color:var(--mut);font-size:13px}
.btn{display:inline-block;border:0;border-radius:10px;background:var(--blue);color:#fff;padding:9px 14px;font-size:14px;cursor:pointer;margin:2px}
.btn:hover{background:var(--blue2)}
.btn.gray{background:#e5e9f2;color:#243049}.btn.gray:hover{background:#d5dbe8}
.btn.red{background:#c0392b}.btn.green{background:#1d7a34}.btn.orange{background:#d97706}
.btn.sm{padding:5px 9px;font-size:12px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid #cfd6e4;border-radius:9px;font:inherit;margin:3px 0;background:#fff}
label{font-size:12px;color:var(--mut)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:150px}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.rt-g{background:#dcf5e0;color:#14532d}.rt-y{background:#fff3cd;color:#8a6d1b}.rt-r{background:#ffdcdc;color:#8a1414}
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border-radius:var(--rad);box-shadow:var(--sh);padding:10px 14px;margin-bottom:14px}
.topbar .logo{font-weight:800;font-size:17px;color:var(--blue);margin-right:auto;cursor:pointer}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs .btn{background:#e5e9f2;color:#243049}.tabs .btn.on{background:var(--blue);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border:1px solid #e3e8f2;padding:7px 8px;text-align:left;vertical-align:top}
th{background:#f3f6fc}
.tbl{overflow-x:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 16px}
.modal{position:fixed;inset:0;background:rgba(15,20,35,.45);display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;z-index:50}
.mbox{background:#fff;border-radius:var(--rad);box-shadow:0 10px 40px rgba(0,0,0,.25);padding:18px;max-width:680px;width:100%;margin-top:30px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#22304a;color:#fff;border-radius:10px;padding:10px 16px;font-size:14px;box-shadow:var(--sh);display:none;z-index:60}
.auth{max-width:460px;margin:40px auto}
.ok{color:#1d7a34;font-weight:700}.no{color:#a81b1b;font-weight:700}
hr{border:0;border-top:1px solid #e6eaf2;margin:12px 0}
.neg{padding:7px 10px;border-radius:9px;margin:5px 0;font-size:13px;font-weight:600}
.neg.hit{background:#ffdcdc;color:#8a1414;border:1px solid #f3b6b6}
.neg.okf{background:#dcf5e0;color:#14532d;border:1px solid #b5e3c2}
.neg.warn{background:#fff3cd;color:#8a6d1b;border:1px solid #ead9a0}
.chk{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid #e3e8f2;border-radius:9px;margin:4px 0;cursor:pointer;font-size:14px}
.chk input{width:18px;height:18px;margin:0}
.clink{color:var(--blue);text-decoration:none;font-weight:600;margin-right:12px;display:inline-block;padding:2px 0}
.clink:active{opacity:.6}
.prog-line{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:10px;margin:6px 0;font-size:14px;border:1px solid #d5dbe2;background:#eceff3;color:#5a6474}
.prog-line.yes{background:#dcf5e0;border-color:#86c79a;color:#14532d}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="modal" id="modal" style="display:none" onclick="if(event.target.id==='modal')closeModal()"><div class="mbox" id="mbox"></div></div>
<div id="toast"></div>
<script>
'use strict';
/* ================= КОНСТАНТЫ ================= */
var APP_NAME='CRM УРМ';
var API_KEY='f8OaDPZO85RG9xS4';
var API_BASE='https://api.checko.ru/v2/';
var NOTE_MAIN='Проверка соответствия льготным программам по основному ОКВЭД';
var TARGETS=['Оборотное кредитование','Инвестиционное кредитование'];
var REGIONS=['Приволжский федеральный округ (ПФО)','Центральный федеральный округ (ЦФО)','Северо-Западный федеральный округ (СЗФО)','Южный федеральный округ (ЮФО)','Северо-Кавказский федеральный округ (СКФО)','Уральский федеральный округ (УФО)','Сибирский федеральный округ (СФО)','Дальневосточный федеральный округ (ДВФО)'];

/* ============================================================
   МАТРИЦА ПРОГРАММ = ТОЛЬКО ЖЁЛТЫЕ ЛИСТЫ файла ОКВЭД.
   Встроенный набор — приближённый резерв; точный даёт загрузка
   файла: Настройки → «Загрузить файл ОКВЭД» → чек-лист листов.
   ============================================================ */
function S(s){return new Set(String(s).trim().split(/\s+/).filter(function(x){return x;}));}
var BUILTIN_PROGRAMS=[
 {id:'GC',sheet:'1. Общие усл и Гарант',note:'Финансирование возможно только по основному ОКВЭД',allowAdd:false,
  main:S('14.19 14.2 16.23 16.24 16.29 17 18 19.3 20 20.14.3 20.14.4 20.14.5 20.14.6 20.14.7 21 22 29.10.1 29.10.3 29.10.4 29.10.5 29.2 29.3 79.9 10.9'),
  add:S(''),excl:S('11 11.0 11.01 19.2 19.20 20.14 20.14.1 20.14.2 29.1 29.10 29.10.2')},
 {id:'KMSP',sheet:'2. Поручительство КМСП',note:'Поручительство КМСП по основному ОКВЭД',allowAdd:false,
  main:S('47.91.3 47.91.4 47.99 47.99.1 47.99.2 47.99.4 47.99.5'),add:S(''),excl:S('47.99.3')},
 {id:'HIGH',sheet:'3. Высокотех',note:'Льготный перечень «ДА», только основной ОКВЭД',allowAdd:false,
  main:S('26 27'),add:S(''),excl:S('')},
 {id:'PSK1764',sheet:'4. 1764+ПСК',note:'Финансирование возможно: на оборотные и инвестиционные цели и только по основному ОКВЭД',allowAdd:false,
  main:S('19 19.1 19.10 20 20.14.3 20.14.4 20.14.5 20.14.6 20.14.7'),add:S(''),excl:S('19.2 19.20 20.14 20.14.1 20.14.2')},
 {id:'MACH',sheet:'5. Станки',note:'По основному ОКВЭД; дополнительно проверяются ДОП. ОКВЭД компании',allowAdd:true,
  main:S('28.4 28.49 28.25.2 28.25.14'),add:S(''),excl:S('')},
 {id:'MONO',sheet:'6. МОНогорода',note:'На оборотные и инвестиционные цели, только основной ОКВЭД, для МСП из СКФО/ДФО/Крыма/Севастополя',allowAdd:false,
  main:S('52'),add:S(''),excl:S('53')},
 {id:'PSK',sheet:'7. ПСК',note:'Финансирование возможно: на оборотные цели и только по основному ОКВЭД',allowAdd:false,
  main:S('11.06 11.07 28.25.2 28.25.14 28.29 29.10.3 29.10.4 29.10.5 29.2 63'),add:S(''),excl:S('11 11.0 11.01 11.02 11.03 11.04 11.05 29.1 29.10 29.10.2')},
 {id:'MOSC',sheet:'8. Москва массовая',note:'Финансирование возможно только по основному ОКВЭД',allowAdd:false,
  main:S(''),add:S(''),excl:S('')}
];
var BUILTIN_EXCL=S('01.21 05 06 07 08 09.10.3 11.01.4 11.02 11.03 11.04 11.05 11.07.2 12 19.2 20.14 29.1 29.10.2 30.91 45.1 46.17.2 46.71 46.72 46.76.4 47.11 47.2 47.25 47.26 47.3 47.99.3 92 19.20');

var PROG_KEY='urm_progs_v1';
var PROGRAMS=[],CUR_EXCL=BUILTIN_EXCL,FROM_FILE=false;
function cloneBuiltins(){return BUILTIN_PROGRAMS.map(function(p){return {id:p.id,sheet:p.sheet,note:p.note,allowAdd:!!p.allowAdd,setMain:new Set(p.main),setAdd:new Set(p.add),setExcl:new Set(p.excl)};});}
function loadPrograms(){
  try{var raw=localStorage.getItem(PROG_KEY);
    if(raw){var o=JSON.parse(raw);
      if(o&&o.progs&&o.progs.length){
        PROGRAMS=o.progs.map(function(p){return {id:p.id,sheet:p.sheet,note:p.note||'',allowAdd:!!p.allowAdd,setMain:new Set(p.main||[]),setAdd:new Set(p.add||[]),setExcl:new Set(p.excl||[])};});
        if(o.excl&&o.excl.length)CUR_EXCL=new Set(o.excl);
        FROM_FILE=!!o.fromFile;
        return;}}}catch(e){}
  PROGRAMS=cloneBuiltins();FROM_FILE=false;
}
function savePrograms(){
  localStorage.setItem(PROG_KEY,JSON.stringify({fromFile:FROM_FILE,progs:PROGRAMS.map(function(p){return {id:p.id,sheet:p.sheet,note:p.note,allowAdd:p.allowAdd,main:Array.from(p.setMain),add:Array.from(p.setAdd),excl:Array.from(p.setExcl)};}),excl:Array.from(CUR_EXCL)}));
}
function resetPrograms(){localStorage.removeItem(PROG_KEY);CUR_EXCL=BUILTIN_EXCL;PROGRAMS=cloneBuiltins();FROM_FILE=false;render();toast('Возвращена встроенная матрица');}
function matrixIsBuiltin(){return !FROM_FILE;}
loadPrograms();
var MKT={id:'MKT',sheet:'Рыночные условия',note:'Без льготной программы'};

/* СТАТУСЫ ЗАЯВКИ */
var STATUSES=[
  {id:'actualization',name:'Актуализация анкеты'},
  {id:'entrepreneur_data',name:'Ввод данных предпринимателя'},
  {id:'verification',name:'Верификация'},
  {id:'new',name:'Новая'},
  {id:'security',name:'Обеспечение по заявке'},
  {id:'approved',name:'Одобрена'},
  {id:'revision',name:'Отправлена на доработку'},
  {id:'board',name:'Отправлена на Правление'},
  {id:'prescoring',name:'Отправлена на прескоринг'},
  {id:'uob',name:'Отправлена на УОБ'},
  {id:'prelim_result',name:'Получен результат предварительной оценки'},
  {id:'prelim_verification',name:'Предварительная верификация'},
  {id:'prelim_assessment',name:'Предварительная оценка'},
  {id:'documents',name:'Предоставление документов'},
  {id:'expertise',name:'Проведение экспертизы'},
  {id:'decision_draft',name:'Проект решения'},
  {id:'declined',name:'Отказ'},
  {id:'canceled',name:'Отменена'}
];

/* ================= ХРАНИЛИЩЕ ================= */
function uid(){return 'id'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);}
function migrate(db){
  (db.users||[]).forEach(function(u){u.city=u.city||u.urm||'';u.region=u.region||'';});
  (db.companies||[]).forEach(function(c){c.contacts=c.contacts||[];c.apps=c.apps||[];c.neg=c.neg||[];c.okveds=c.okveds||[];
    c.contacts.forEach(function(ct){ct.primary=!!ct.primary;});});
  return db;
}
function load(){
  try{var raw=localStorage.getItem('urm_db_v2');if(raw)return migrate(JSON.parse(raw));}catch(e){}
  return migrate({users:[
    {id:'u1',login:'manager',pass:'manager',role:'manager',name:'Иванов Иван Иванович',city:'Москва',region:'Центральный федеральный округ (ЦФО)'},
    {id:'u2',login:'boss',pass:'boss',role:'boss',name:'Петров Пётр Петрович',city:'Москва',region:'Центральный федеральный округ (ЦФО)'}],
    companies:[seedCompany()],session:null});
}
function seedCompany(){return {id:'c1',inn:'7701234567',name:'ООО «Демо-Завод»',kpp:'770101001',ogrn:'1177746000000',
  address:'г. Москва, ул. Промышленная, д. 12',capital:'10 000 000 ₽',emails:['info@demozavod.ru'],phones:['+7 495 000-00-00'],
  okveds:[{code:'49.10',main:true,name:'Деятельность железнодорожного транспорта (демо)'},{code:'62.01',main:false,name:'Разработка ПО (демо)'}],
  managerId:'u1',archived:false,createdAt:Date.now(),neg:[],mgmt:'Директор Иванов И.И. (демо)',region:'Москва',founded:'2015-01-01',sredsp:25,sredspYear:'2025',
  contacts:[{id:'auto-dir',auto:true,primary:true,name:'Иванов Иван Иванович (демо)',pos:'Директор',phone:'+7 495 000-00-00',email:'info@demozavod.ru'}],
  apps:[{id:'a1',sum:50000000,term:6,program:'MKT',programName:'Рыночные условия',target:'Оборотное кредитование',
    empEmail:'',empPhone:'',status:'new',createdAt:Date.now(),managerId:'u1',managerName:'Хусаинов Рустем Рифович',comments:[]}],
  taxes:null,msp:null,support:[],analysis:null};}
var DB=load();
function save(){localStorage.setItem('urm_db_v2',JSON.stringify(DB));}
function currentUser(){return DB.session?DB.users.find(function(u){return u.id===DB.session.userId;})||null:null;}
function getCompany(id){return DB.companies.find(function(c){return c.id===id;});}
function mainCode(c){var o=(c.okveds||[]).find(function(x){return x.main;})||(c.okveds||[])[0];return o?o.code:'';}
function addCodes(c){return (c.okveds||[]).filter(function(x){return !x.main;}).map(function(x){return x.code;});}
function mgrName(id){var u=DB.users.find(function(x){return x.id===id;});return u?u.name:'—';}
function mgrCity(id){var u=DB.users.find(function(x){return x.id===id;});return (u&&u.city)||'—';}
function mgrRegion(id){var u=DB.users.find(function(x){return x.id===id;});return (u&&u.region)||'—';}
function roleTitle(r){return r==='boss'?'Руководитель/Куратор':(r==='director'?'Региональный директор':'Региональный менеджер');}
function regionShort(r){var m=String(r||'').match(/\(([^)]+)\)/);return m?m[1]:(r||'');}
function stName(id){var s=STATUSES.find(function(x){return x.id===id;});return s?s.name:id;}
function stPill(id){
  var s=STATUSES.find(function(x){return x.id===id;});var color='#6b7280';
  if(id==='approved')color='#1d7a34';else if(id==='declined'||id==='canceled')color='#a81b1b';
  else if(id==='verification'||id==='prelim_verification')color='#1b5ea8';else if(id==='new')color='#d97706';
  return '<span class="pill" style="color:#fff;background:'+color+'">'+(s?s.name:id)+'</span>';
}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtMoney(n){return Number(n||0).toLocaleString('ru-RU')+' ₽';}
function fmtDate(ts){return new Date(ts).toLocaleDateString('ru-RU');}
function fmtNum(n){return Number(n||0).toLocaleString('ru-RU');}
function num(v){
  if(v==null)return null;
  if(typeof v==='number')return isFinite(v)?v:null;
  if(typeof v==='string'){var n=parseFloat(v.replace(/\s/g,'').replace(',','.'));return isNaN(n)?null:n;}
  if(typeof v==='object'){return num(v.value!=null?v.value:(v['Значение']!=null?v['Значение']:null));}
  return null;
}
function fm(v){return v==null?'—':fmtNum(v);}
function fmtR(v){if(v==null)return '—';var r=Math.round(v*100)/100;return String(r).replace('.',',');}
function pct(v){if(v==null)return '—';return (Math.round(v*1000)/10)+'%';}
function div(a,b){return (a==null||b==null||b===0)?null:a/b;}

/* ================= ОКВЭД / ПРОГРАММЫ ================= */
function matchProg(code,set,excl){
  var p=String(code||'').trim();
  while(p){
    if(excl&&excl.has(p))return null;
    if(set.has(p))return p;
    var i=p.lastIndexOf('.');p=i>0?p.slice(0,i):'';
  }
  return null;
}
function matchHier(code,set){return matchProg(code,set,null);}
function programMatches(c){
  var main=mainCode(c),adds=addCodes(c),res=[];
  PROGRAMS.forEach(function(p){
    var m=matchProg(main,p.setMain,p.setExcl);
    if(m){res.push({prog:p,matched:m,via:'main'});return;}
    if(p.allowAdd){
      for(var i=0;i<adds.length;i++){
        var ma=matchProg(adds[i],p.setMain,p.setExcl);
        if(ma){res.push({prog:p,matched:ma,via:'add'});break;}
      }
    }
  });
  return res;
}
function isPreferential(c){return programMatches(c).length>0;}
function isExclude(code){return !!matchHier(code,CUR_EXCL);}
function allProgramOptions(){return PROGRAMS.concat([MKT]);}
function progNameById(id){var p=PROGRAMS.find(function(x){return x.id===id;});return p?p.sheet:(id==='MKT'?MKT.sheet:id);}
function progLabel(p){return p.sheet+' — '+p.note;}

/* ================= ЗАГРУЗКА ФАЙЛА: ТОЛЬКО ЖЁЛТЫЕ ЛИСТЫ ================= */
function sheetColor(wb,ws,idx){
  var c=null;
  try{c=c||ws['!tabcolor']||ws['!tabColor'];}catch(e){}
  try{var w=(wb.Workbook&&wb.Workbook.Sheets&&wb.Workbook.Sheets[idx])||null;
    if(w)c=c||w.Color||w.TabColor||w.tabColor;}catch(e){}
  if(!c)return null;
  var h=String(c).replace(/[^0-9a-fA-F]/g,'');
  if(h.length===8)h=h.slice(2);
  if(h.length<6)return null;
  return h.slice(0,6).toUpperCase();
}
function isYellowHex(h){
  if(!h)return false;
  var r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  return r>=200&&g>=150&&b<=120;
}
function prefixYellow(name){return /^[1-8]([.\s]|$)/.test(String(name||'').trim());}
function pickNote(r){
  for(var k=2;k<=4;k++){
    var v=String(r[k]||'').replace(/\s+/g,' ').trim();
    if(/финанс|оквэд|поручитель|цели|возмож/i.test(v))return v;
  }
  return '';
}
function handleOkvedFile(input){
  var f=input.files[0];if(!f)return;
  if(!window.XLSX){toast('Библиотека XLSX ещё не загрузилась, повторите через пару секунд');return;}
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var wb=XLSX.read(new Uint8Array(rd.result),{type:'array',cellStyles:true});
      var sheets=[],colorSeen=false;
      wb.SheetNames.forEach(function(sn,idx){
        var ws=wb.Sheets[sn];if(!ws)return;
        var col=sheetColor(wb,ws,idx);
        if(col)colorSeen=true;
        var rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''});
        var main=[],add=[],excl=[],note='';
        rows.forEach(function(r){
          var code=String(r[0]||'').trim();
          var b=String(r[1]||'').trim().toUpperCase();
          if(!/^\d{1,2}(\.\d{1,2}){0,3}$/.test(code))return;
          var nt=pickNote(r);
          if(b.indexOf('ДА/НЕТ')===0){add.push(code);if(nt&&!note)note=nt;}
          else if(b.indexOf('ДА')===0){main.push(code);if(nt&&!note)note=nt;}
          else if(b.indexOf('НЕТ')===0&&/нужно исключать/i.test(nt)){excl.push(code);}
        });
        if(main.length+add.length>=5){
          sheets.push({name:sn,color:col,note:note,main:main,add:add,excl:excl,
            pick:col?isYellowHex(col):prefixYellow(sn)});
        }
      });
      if(!sheets.length){toast('В файле не найдено листов с кодами ДА/НЕТ');return;}
      window._fileSheets=sheets;window._colorDetected=colorSeen;
      openSheetPicker();
    }catch(e){toast('Ошибка чтения файла: '+e.message);}
  };
  rd.readAsArrayBuffer(f);
}
function openSheetPicker(){
  var html='<h3>Листы файла ОКВЭД</h3>'+
   '<div class="mut">Отметьте <b>жёлтые листы</b> — только они участвуют в проверке программ. '+
   (window._colorDetected?'Цвет вкладок определён автоматически.':'Цвет вкладок не читается — предварительно отмечены листы с номерами 1–8; проверьте отметки вручную.')+
   '</div>';
  window._fileSheets.forEach(function(s,i){
    html+='<label class="chk"><input type="checkbox" '+(s.pick?'checked':'')+' onchange="window._fileSheets['+i+'].pick=this.checked">'+

/* ================= ВНЕШНИЙ СЕРВИС ДАННЫХ (API) ================= */
var PROXIES=[
  function(u){return 'https://api.allorigins.win/raw?url='+encodeURIComponent(u);},
  function(u){return 'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u);},
  function(u){return 'https://corsproxy.io/?url='+encodeURIComponent(u);}
];
function bizErr(j,status){return new Error((j&&j.meta&&j.meta.message)||('Ошибка сервиса '+(status||'')));}
async function apiGet(path){
  var url=API_BASE+path+(path.indexOf('?')>=0?'&':'?')+'key='+encodeURIComponent(API_KEY);
  /* прямой запрос */
  try{
    var r=await fetch(url);
    var j=null;try{j=await r.json();}catch(e){}
    if(j&&j.meta&&j.meta.status==='error')throw bizErr(j,j.meta.code||r.status);
    if(!r.ok||!j)throw new Error('HTTP '+r.status);
    return j;
  }catch(e){
    if(e&&e.biz)throw e;
    var last=e;
    /* запасные прокси, если браузер блокирует прямой запрос */
    for(var i=0;i<PROXIES.length;i++){
      try{
        var r2=await fetch(PROXIES[i](url));
        if(!r2.ok)throw new Error('HTTP '+r2.status);
        var j2=await r2.json();
        if(j2&&j2.meta&&j2.meta.status==='error')throw bizErr(j2,j2.meta.code||r2.status);
        return j2;
      }catch(e2){
        if(e2&&e2.biz)throw e2;
        last=e2;
      }
    }
    throw last;
  }
}

/* ================= ФИНАНАЛИЗ (бухотчётность организации) =================
   Метод сервиса: /v2/finances?key=…&inn=…
   Формат ответа: { company:{…}, data:{ "2019":{ "1100":…, "2110":… }, … },
   "bo.nalog.ru":{ "Отчет":{ "2019": url,… } }, meta:{…} }                    */
function parseFinReport(j){
  var years={},links={};
  if(!j||typeof j!=='object')return {years:years,links:links};
  var roots=[j.data,j['finance'],j['finances'],j['Финансы'],j['БухгалтерскаяОтчетность'],j['Отчетность'],j];
  roots.forEach(function(o){
    if(!o||typeof o!=='object')return;
    Object.keys(o).forEach(function(k){
      if(!/^(19|20)\d{2}$/.test(k))return;
      var v=o[k];
      if(!v||typeof v!=='object'||Array.isArray(v))return;
      var ks=Object.keys(v);if(!ks.length)return;
      var isLinks=ks.every(function(kk){return typeof v[kk]==='string'&&v[kk].indexOf('http')===0;});
      if(isLinks){ks.forEach(function(kk){if(!links[kk])links[kk]=v[kk];});}
      else if(!years[k])years[k]=v;
    });
  });
  var bo=j['bo.nalog.ru']||j['bo_nalog_ru']||null;
  if(bo&&bo['Отчет']&&typeof bo['Отчет']==='object'){
    Object.keys(bo['Отчет']).forEach(function(y){if(!links[y])links[y]=bo['Отчет'][y];});
  }
  return {years:years,links:links};
}
function fg(f,codes){
  if(!f)return null;
  for(var i=0;i<codes.length;i++){var v=num(f[codes[i]]);if(v!=null)return v;}
  return null;
}
function calcFin(f){
  var o={};
  o.rev=fg(f,['2110']);o.cogs=fg(f,['2120']);o.gross=fg(f,['2100']);o.ebit=fg(f,['2200']);
  o.pretax=fg(f,['2300']);o.tax=fg(f,['2410']);o.net=fg(f,['2400']);o.int=fg(f,['2330']);
  o.depr=fg(f,['Амортизация','AMORT','DEPR']);
  o.nca=fg(f,['1100']);o.fa=fg(f,['1150']);o.inv=fg(f,['1210']);o.recv=fg(f,['1230']);o.cash=fg(f,['1250']);o.ca=fg(f,['1200']);
  o.assets=fg(f,['1600']);o.equity=fg(f,['1300']);o.ltl=fg(f,['1400']);o.bL=fg(f,['1410','1450']);
  o.stl=fg(f,['1500']);o.bS=fg(f,['1510','1520']);
  o.ebitda=(o.pretax!=null)?o.pretax:((o.net!=null&&o.tax!=null)?o.net+Math.abs(o.tax):null);
  if(o.ebitda!=null){
    if(o.int!=null)o.ebitda+=Math.abs(o.int);
    if(o.depr!=null)o.ebitda+=Math.abs(o.depr);
  }
  o.hasDepr=o.depr!=null;
  o.debt=(o.bL!=null||o.bS!=null)?((o.bL||0)+(o.bS||0)):null;
  o.netDebt=(o.debt!=null)?o.debt-(o.cash||0):null;
  o.cr=div(o.ca,o.stl);
  o.qr=div((o.ca!=null&&o.inv!=null)?(o.ca-o.inv):o.ca,o.stl);
  o.ar=div(o.cash,o.stl);
  o.aut=div(o.equity,o.assets);
  o.d2e=div((o.ltl!=null&&o.stl!=null)?(o.ltl+o.stl):null,o.equity);
  o.npm=div(o.net,o.rev);o.gm=div(o.gross,o.rev);o.roa=div(o.net,o.assets);o.roe=div(o.net,o.equity);o.at=div(o.rev,o.assets);
  o.em=div(o.ebitda,o.rev);
  o.de=div(o.debt,o.ebitda);o.nde=div(o.netDebt,o.ebitda);
  return o;
}
function clsCR(v){return v==null?'':v>=2?'rt-g':v>=1.2?'rt-y':'rt-r';}
function clsQR(v){return v==null?'':v>=1?'rt-g':v>=0.7?'rt-y':'rt-r';}
function clsAR(v){return v==null?'':v>=0.2?'rt-g':v>=0.1?'rt-y':'rt-r';}
function clsAUT(v){return v==null?'':v>=0.5?'rt-g':v>=0.3?'rt-y':'rt-r';}
function clsD2E(v){return v==null?'':v<=1?'rt-g':v<=1.5?'rt-y':'rt-r';}
function clsNPM(v){return v==null?'':v>0.05?'rt-g':v>0?'rt-y':'rt-r';}
function clsRO(v){return v==null?'':v>0?'rt-g':'rt-r';}
function clsDE(v,eb){if(eb==null||eb<=0)return 'rt-r';if(v==null)return '';return v<=3?'rt-g':v<=4?'rt-y':'rt-r';}
function mspText(m){

var state={view:'auth',tab:'info',cid:null,q:'',authTab:'login',boss:{status:'',mgrs:[],urms:[],mode:'fio',q:'',region:''}};
function render(){
  var u=currentUser();var app=document.getElementById('app');
  if(!u){app.innerHTML=viewAuth();return;}
  if(state.view==='company'&&getCompany(state.cid)){app.innerHTML=topbar(u)+viewCompany(u);return;}
  if(state.view==='settings'&&u.role==='boss'){app.innerHTML=topbar(u)+viewSettings(u);return;}
  state.view='home';app.innerHTML=topbar(u)+viewHome(u);
}
function goHome(){state.view='home';render();}
function goSettings(){state.view='settings';render();}
function setTab(t){state.tab=t;render();}
function logout(){DB.session=null;save();state.view='auth';render();}
function openCompany(id){
  var u=currentUser();var c=getCompany(id);if(!c)return;
  if(u.role!=='boss'&&c.managerId!==u.id){toast('Компания недоступна');return;}
  state.cid=id;state.view='company';state.tab='info';render();
  if(c.okveds&&c.okveds.length&&c.okveds.some(function(o){return !o.name;})&&!c.namesTried){
    c.namesTried=true;save();refreshChecko(true);
  }
}
function refocus(id){var el=document.getElementById(id);if(el){el.focus();var L=el.value.length;try{el.setSelectionRange(L,L);}catch(e){}}}
function setQ(v){state.q=v;render();refocus('q-mgr');}
function setBossQ(v){state.boss.q=v;render();refocus('q-boss');}
function setBossStatus(v){state.boss.status=v;render();}
function setBossMode(v){state.boss.mode=v;render();}
function setBossRegion(v){state.boss.region=v;render();}
function toggleBossMgr(id){var i=state.boss.mgrs.indexOf(id);i>=0?state.boss.mgrs.splice(i,1):state.boss.mgrs.push(id);render();}
function toggleBossUrm(v){var i=state.boss.urms.indexOf(v);i>=0?state.boss.urms.splice(i,1):state.boss.urms.push(v);render();}

function doLogin(e){e.preventDefault();
  var l=document.getElementById('lg').value.trim(),p=document.getElementById('pw').value;
  var u=DB.users.find(function(x){return x.login===l&&x.pass===p;});
  if(!u){toast('Неверный логин или пароль');return false;}
  DB.session={userId:u.id};save();state.view='home';render();return false;}
function doRegister(e){e.preventDefault();
  var g=function(id){return document.getElementById(id).value.trim();};
  var last=g('rg-last'),first=g('rg-first'),patr=g('rg-patr');
  var city=g('rg-city'),region=g('rg-region'),lg=g('rg-lg'),pw=g('rg-pw'),role=document.getElementById('rg-role').value;
  if(!last||!first||!patr){toast('Заполните Фамилию, Имя и Отчество полностью');return false;}
  if(!city||!region||!lg||!pw){toast('Заполните все обязательные поля');return false;}
  if(DB.users.find(function(x){return x.login===lg;})){toast('Логин занят');return false;}
  var nm=last+' '+first+' '+patr;
  DB.users.push({id:uid(),login:lg,pass:pw,role:role,name:nm,city:city,region:region});
  DB.session={userId:DB.users[DB.users.length-1].id};save();state.view='home';render();
  toast('Аккаунт создан: '+roleTitle(role));return false;}

function viewHome(u){return u.role==='boss'?bossBoard(u):managerHome(u);}
function managerHome(u){
  var q=state.q.toLowerCase();
  var list=DB.companies.filter(function(c){return c.managerId===u.id&&!c.archived;})
    .filter(function(c){return !q||(c.name||'').toLowerCase().indexOf(q)>=0||(c.inn||'').indexOf(q)>=0;});
  var html='<div class="card"><div class="row" style="align-items:center"><h2 style="margin:0">Мои компании</h2>'+
    '<span style="flex:1"></span><button class="btn" onclick="newCompanyModal()">+ Компания</button></div>'+
    '<input id="q-mgr" placeholder="Поиск: название или ИНН" value="'+esc(state.q)+'" oninput="setQ(this.value)"></div>';
  if(!list.length)html+='<div class="card mut">Компаний нет. Нажмите «+ Компания».</div>';
  list.forEach(function(c){
    var pref=isPreferential(c);
    var apps=c.apps.filter(function(a){return a.status!=='declined'&&a.status!=='canceled';}).length;
    var negHit=(c.neg||[]).filter(function(n){return n.hit;}).length;
    html+='<div class="card"><div class="row" style="align-items:center">'+
      '<div style="flex:3;min-width:220px"><h3 style="margin:0"><a href="#" onclick="openCompany(\''+c.id+'\');return false" style="color:var(--blue);text-decoration:none">'+esc(c.name)+'</a></h3>'+
      '<div class="mut">ИНН '+esc(c.inn)+' · основной ОКВЭД '+esc(mainCode(c))+' · заявок: '+apps+'</div></div>'+
      '<div>'+(pref?'<span class="pill ok" style="background:#dcf5e0">Льготная программа</span>':'<span class="pill" style="background:#e5e9f2;color:#243049">Рыночные условия</span>')+
      (negHit?' <span class="pill no" style="background:#ffdcdc">Нег-факторы: '+negHit+'</span>':'')+'</div>'+
      '<div><button class="btn sm" onclick="openCompany(\''+c.id+'\')">Открыть</button></div></div></div>';
  });
  return html;
}
function scopedManagers(){return DB.users.filter(function(x){return x.role==='manager'||x.role==='director';});}
function appPairs(u){
  var pairs=[];
  DB.companies.forEach(function(c){(c.apps||[]).forEach(function(a){pairs.push({c:c,a:a});});});
  var f=state.boss;
  return pairs.filter(function(p){
    if(f.status&&p.a.status!==f.status)return false;
    if(f.region&&mgrRegion(p.c.managerId)!==f.region)return false;
    if(f.mode==='urm'&&f.urms.length&&f.urms.indexOf(mgrCity(p.c.managerId))<0)return false;
    if(f.mode!=='urm'&&f.mgrs.length&&f.mgrs.indexOf(p.c.managerId)<0)return false;
    var q=f.q.toLowerCase();
    if(q&&(p.c.name||'').toLowerCase().indexOf(q)<0&&(p.c.inn||'').indexOf(q)<0)return false;
    return true;});
}
function cityList(){
  var res=[];scopedManagers().forEach(function(m){if(m.city&&res.indexOf(m.city)<0)res.push(m.city);});
  return res;
}

function saveEditApp(aid){
  var c=getCompany(state.cid);

  var sum=parseFloat(document.getElementById('ed-sum').value);
  if(!(sum>0)){toast('Укажите сумму');return;}

  a.term=parseInt(document.getElementById('ed-term').value,10)||12;
  a.program=document.getElementById('ed-prog').value;

  a.target=document.getElementById('ed-target').value;
  a.empEmail=document.getElementById('ed-ee').value.trim();
  a.empPhone=document.getElementById('ed-ep').value.trim();

async function queryCheck(){
  var inn=document.getElementById('nc-inn').value.trim();
  var out=document.getElementById('nc-out');var negBox=document.getElementById('nc-neg');
  if(!/^\d{10,15}$/.test(inn)){out.textContent='ИНН: 10 или 12 цифр';return;}
  out.textContent='Запрашиваем данные…';negBox.innerHTML='';
  var j;
  try{j=await apiGet('company?inn='+inn);}
  catch(err){out.textContent='Не удалось получить данные: '+err.message+'. Заполните поля вручную.';
    window._neg=defaultNeg('проверка недоступна');negBox.innerHTML=negHtml(window._neg);return;}
  var n=normCompany(j);
  if(!n.name&&!n.inn){out.textContent='Компания не найдена по ИНН.';return;}
  window._norm=n;
  document.getElementById('nc-name').value=n.name;document.getElementById('nc-addr').value=n.address;
  document.getElementById('nc-kpp').value=n.kpp;document.getElementById('nc-ogrn').value=n.ogrn;
  document.getElementById('nc-cap').value=n.capital;document.getElementById('nc-em').value=n.emails.join(', ');
  document.getElementById('nc-ph').value=n.phones.join(', ');document.getElementById('nc-okv').value=n.okvedMain;
  document.getElementById('nc-okvadd').value=n.okveds.filter(function(o){return !o.main;}).map(function(o){return o.code;}).join(', ');
  out.textContent='Данные получены. Проверяем негатив-факторы…';
  negBox.innerHTML='<div class="mut">Проверка негатив-факторов…</div>';
  var neg;
  try{neg=await fetchNegFactors(inn,j.data);}catch(e){neg=defaultNeg('проверка недоступна');}
  window._neg=neg;negBox.innerHTML=negHtml(neg);
  out.textContent='Данные получены';
}
async function refreshChecko(silent){
  var c=getCompany(state.cid);if(!c)return;
  try{
    var j=await apiGet('company?inn='+c.inn);
    var n=normCompany(j);
    if(n.name)c.name=n.name;if(n.address)c.address=n.address;if(n.kpp)c.kpp=n.kpp;if(n.ogrn)c.ogrn=n.ogrn;
    if(n.capital)c.capital=n.capital;if(n.emails.length)c.emails=n.emails;if(n.phones.length)c.phones=n.phones;
    if(n.okvedMain)c.okveds=n.okveds;
    c.mgmt=n.mgmt||c.mgmt;c.region=n.region||c.region;c.founded=n.founded||c.founded;
    if(n.sredsp!=null){c.sredsp=n.sredsp;c.sredspYear=n.sredspYear;}
    if(n.taxes)c.taxes=n.taxes;if(n.msp)c.msp=n.msp;if(n.support)c.support=n.support;
    mergeAutoContacts(c,n);
    try{c.neg=await fetchNegFactors(c.inn,j.data);}catch(e){}
    save();render();if(!silent)toast('Данные обновлены');
  }catch(err){save();render();if(!silent)toast('Не удалось обновить: '+err.message);}
}
function createCompany(e){e.preventDefault();
  var u=currentUser();
  var inn=document.getElementById('nc-inn').value.trim();
  if(!/^\d{10,15}$/.test(inn)){toast('ИНН: 10 или 12 цифр');return false;}
  if(DB.companies.find(function(c){return c.inn===inn;})){toast('Компания с таким ИНН уже есть');return false;}
  var g=function(id){return document.getElementById(id).value.trim();};
  var okvs=[{code:g('nc-okv'),main:true,name:''}];
  g('nc-okvadd').split(/[,;\s]+/).filter(function(x){return x;}).forEach(function(k){okvs.push({code:k,main:false,name:''});});
  var mid=(u.role==='manager'||u.role==='director')?u.id:((scopedManagers()[0]||u).id);
  var n=window._norm;
  var c={id:uid(),inn:inn,name:g('nc-name'),kpp:g('nc-kpp'),ogrn:g('nc-ogrn'),address:g('nc-addr'),capital:g('nc-cap'),
    emails:g('nc-em').split(/[,;]+/).map(function(s){return s.trim();}).filter(function(s){return s;}),
    phones:g('nc-ph').split(/[,;]+/).map(function(s){return s.trim();}).filter(function(s){return s;}),
    okveds:okvs,managerId:mid,archived:false,createdAt:Date.now(),contacts:[],apps:[],neg:window._neg||[],namesTried:true,
    mgmt:'',region:'',founded:'',sredsp:null,sredspYear:'',taxes:null,msp:null,support:[],analysis:null};
  if(n&&n.inn===inn){
    c.mgmt=n.mgmt;c.region=n.region;c.founded=n.founded;c.sredsp=n.sredsp;c.sredspYear=n.sredspYear;
    if(n.okvedMain)c.okveds=n.okveds;
    c.contacts=autoContacts(n);
    c.taxes=n.taxes;c.msp=n.msp;c.support=n.support;
  }
  DB.companies.push(c);save();closeModal();openCompany(c.id);toast('Компания создана');return false;}

    '<div><label>Новый</label><input id="cp-new" type="password" required></div></div><button class="btn sm">Сменить</button></form><hr>'+
    '<h3>Сотрудники (менеджеры и директора)</h3><form onsubmit="return addManager(event)">'+

    '<div class="row"><div><label>Имя *</label><input id="am-first" required></div><div><label>Отчество *</label><input id="am-patr" required></div></div>'+
    '<div class="row"><div><label>УРМ г. *</label><input id="am-city" required></div>'+
    '<div><label>Регион (ФО) *</label><select id="am-region" required><option value="">— выберите —</option>'+REGIONS.map(function(r){return '<option value="'+esc(r)+'">'+esc(r)+'</option>';}).join('')+'</select></div></div>'+
    '<div class="row"><div><label>Роль</label><select id="am-role"><option value="manager">Региональный менеджер</option><option value="director">Региональный директор</option></select></div>'+
    '<div><label>Логин</label><input id="am-lg" required></div><div><label>Пароль</label><input id="am-pw" required></div></div>'+
    '<button class="btn sm">Добавить сотрудника</button></form><hr>';
  scopedManagers().forEach(function(m){
    var n=DB.companies.filter(function(c){return c.managerId===m.id;}).length;
    html+='<div class="row" style="align-items:center"><div style="flex:2"><b>'+esc(m.name)+'</b> <span class="mut">'+roleTitle(m.role)+' · УРМ '+esc(m.city||'—')+', '+esc(regionShort(m.region))+' · login: '+esc(m.login)+' · компаний: '+n+'</span></div>'+

function changePass(e){e.preventDefault();var u=currentUser();
  if(document.getElementById('cp-old').value!==u.pass){toast('Старый пароль неверен');return false;}
  u.pass=document.getElementById('cp-new').value;save();render();toast('Пароль изменён');return false;}
function addManager(e){e.preventDefault();
  var g=function(id){return document.getElementById(id).value.trim();};
  var last=g('am-last'),first=g('am-first'),patr=g('am-patr');
  if(!last||!first||!patr){toast('Заполните Фамилию, Имя и Отчество полностью');return false;}
  var lg=g('am-lg');
  if(DB.users.find(function(x){return x.login===lg;})){toast('Логин занят');return false;}
  DB.users.push({id:uid(),login:lg,pass:g('am-pw'),role:document.getElementById('am-role').value,name:last+' '+first+' '+patr,city:g('am-city'),region:g('am-region')});
  save();render();toast('Сотрудник добавлен');return false;}
function delManager(id){if(!confirm('Удалить сотрудника?'))return;
  DB.users=DB.users.filter(function(x){return x.id!==id;});
  DB.companies.forEach(function(c){if(c.managerId===id)c.managerId=null;});
  save();render();}

/* ================= EXCEL ================= */
function exportRows(rows,fname){
  if(window.XLSX){
    var ws=XLSX.utils.aoa_to_sheet(rows);
    var widths=rows[0].map(function(_,i){
      var m=10;
      rows.forEach(function(r){var v=r[i]==null?'':String(r[i]);if(v.length>m)m=v.length;});
      return {wch:Math.min(45,m+2)};});
    ws['!cols']=widths;
    var wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'Отчёт');
    XLSX.writeFile(wb,fname+'.xlsx');
  }else{
    var csv='\uFEFF'+rows.map(function(r){
      return r.map(function(x){return '"'+String(x==null?'':x).replace(/"/g,'""')+'"';}).join(';');}).join('\n');
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    a.download=fname+'.csv';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
  }
}
function buildAppsRows(u){
  var pairs=appPairs(u);
  var rows=[['Компания','ИНН','Осн. ОКВЭД','Соответствие льготным программам','Программа заявки','Целевое использование','Сумма','Срок (мес)','Статус','Сотрудник','УРМ','Регион','E-mail аналитика','Тел. аналитика','Создана','Комментарии']];
  pairs.forEach(function(p){
    var mm=programMatches(p.c).map(function(x){return x.prog.sheet+(x.via==='add'?' (доп. ОКВЭД)':'');}).join('; ');
    rows.push([p.c.name,p.c.inn,mainCode(p.c),mm||'—',p.a.programName||progNameById(p.a.program),p.a.target||'',p.a.sum,p.a.term,stName(p.a.status),
      mgrName(p.c.managerId),mgrCity(p.c.managerId),mgrRegion(p.c.managerId),p.a.empEmail||'',p.a.empPhone||'',fmtDate(p.a.createdAt),
      (p.a.comments||[]).map(function(cm){return cm.author+': '+cm.text;}).join(' | ')]);});
  return rows;
}
function exportApps(){
  var u=currentUser();
  var rows=buildAppsRows(u);
  if(rows.length<=1){toast('Нет данных для отчёта');return;}
  exportRows(rows,'CRM_УРМ_заявки_'+new Date().toISOString().slice(0,10));
  toast('Отчёт выгружен');
}

/* ================= TOAST / PWA ================= */
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.style.display='block';
  clearTimeout(t._h);t._h=setTimeout(function(){t.style.display='none';},2600);}
function makeIcon(){
  var cv=document.createElement('canvas');cv.width=cv.height=64;var x=cv.getContext('2d');
  x.fillStyle='#1b5ea8';x.beginPath();
  if(x.roundRect)x.roundRect(4,4,56,56,10);else x.rect(4,4,56,56);
  x.fill();
  x.fillStyle='#fff';x.fillRect(14,18,36,5);x.fillRect(14,29,36,5);x.fillRect(14,40,24,5);
  var url=cv.toDataURL('image/png');
  var l=document.createElement('link');l.rel='icon';l.href=url;document.head.appendChild(l);
  var a=document.createElement('link');a.rel='apple-touch-icon';a.href=url;document.head.appendChild(a);
  return url;
}
function initPWA(icon){
  try{
    var mf={name:APP_NAME,short_name:APP_NAME,start_url:'.',display:'standalone',
      background_color:'#eef1f7',theme_color:'#1b5ea8',icons:[{src:icon,sizes:'64x64',type:'image/png'}]};
    var l=document.createElement('link');l.rel='manifest';
    l.href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:'application/json'}));
    document.head.appendChild(l);
  }catch(e){}
  if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
}

/* ================= СТАРТ ================= */
var ICON=makeIcon();
initPWA(ICON);
render();
