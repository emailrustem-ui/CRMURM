<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Заявки УРМ</title>
<script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --msp-blue:#0055A5;
  --msp-blue-dark:#003F7F;
  --msp-blue-light:#E6F0FA;
  --msp-orange:#F26522;
  --msp-orange-light:#FFF0E6;
  --msp-gray:#6B7280;
  --msp-gray-light:#F5F7FA;
  --msp-border:#E2E8F0;
  --msp-text:#1A2332;
  --msp-radius:12px;
  --msp-shadow:0 2px 8px rgba(0,85,165,.08);
  --msp-shadow-lg:0 8px 24px rgba(0,85,165,.12);
}
*{box-sizing:border-box}
body{margin:0;background:var(--msp-gray-light);color:var(--msp-text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:var(--msp-radius);box-shadow:var(--msp-shadow);padding:18px;margin-bottom:14px;border:1px solid var(--msp-border)}
.card-header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1,h2,h3{margin:0 0 10px}
h1{font-size:22px;color:var(--msp-blue)}
h2{font-size:18px;color:var(--msp-text)}
h3{font-size:15px;color:var(--msp-text);font-weight:700}
.mut{color:var(--msp-gray);font-size:12px}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:8px;background:var(--msp-blue);color:#fff;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;margin:2px;transition:all .15s}
.btn:hover{background:var(--msp-blue-dark);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.orange{background:var(--msp-orange)}
.btn.orange:hover{background:#D9551A}
.btn.gray{background:#F1F5F9;color:var(--msp-text)}
.btn.gray:hover{background:#E2E8F0}
.btn.red{background:#DC2626}
.btn.green{background:#16A34A}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.wide{width:100%;justify-content:center}
input,select,textarea{width:100%;padding:9px 11px;border:1.5px solid var(--msp-border);border-radius:8px;font:inherit;margin:3px 0;background:#fff;font-size:13px;color:var(--msp-text);transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--msp-blue)}
select{min-height:34px;white-space:normal;word-wrap:break-word}
select option{white-space:normal;word-wrap:break-word}
label{font-size:11px;color:var(--msp-gray);display:block;margin-top:8px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700}
.pill.blue{background:var(--msp-blue-light);color:var(--msp-blue)}
.pill.orange{background:var(--msp-orange-light);color:var(--msp-orange)}
.pill.green{background:#DCFCE7;color:#166534}
.pill.red{background:#FEE2E2;color:#991B1B}
.pill.gray{background:#F1F5F9;color:#475569}
.pill.yellow{background:#FEF3C7;color:#92400E}
.topbar{background:#fff;border-radius:var(--msp-radius);box-shadow:var(--msp-shadow);padding:10px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--msp-border)}
.topbar .logo-wrap{display:inline-flex;align-items:center;gap:10px;cursor:pointer}
.logo-steps{width:36px;height:36px;display:block}
.logo-text{font-weight:800;font-size:18px;color:var(--msp-blue);letter-spacing:-.3px}
.logo-text span{color:var(--msp-orange)}
.topbar .usr{font-size:12px;color:var(--msp-gray);margin-left:auto}
.topbar .usr b{color:var(--msp-text)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;border-bottom:2px solid var(--msp-border);padding-bottom:0}
.tabs .btn{background:transparent;color:var(--msp-gray);border-radius:8px 8px 0 0;margin:0;padding:10px 14px;font-weight:600;border-bottom:3px solid transparent}
.tabs .btn:hover{background:var(--msp-blue-light);color:var(--msp-blue)}
.tabs .btn.on{color:var(--msp-blue);border-bottom-color:var(--msp-orange);background:var(--msp-blue-light)}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border-bottom:1px solid var(--msp-border);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--msp-gray-light);font-weight:700;color:var(--msp-gray);text-transform:uppercase;font-size:11px;letter-spacing:.3px}
tr:hover td{background:var(--msp-blue-light)}
.tbl{overflow-x:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 18px}
.modal{position:fixed;inset:0;background:rgba(0,30,60,.5);display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;z-index:50;backdrop-filter:blur(2px)}
.mbox{background:#fff;border-radius:var(--msp-radius);box-shadow:var(--msp-shadow-lg);padding:22px;max-width:660px;width:100%;margin-top:30px;border-top:4px solid var(--msp-orange)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--msp-blue);color:#fff;border-radius:10px;padding:10px 18px;font-size:13px;font-weight:600;box-shadow:var(--msp-shadow-lg);display:none;z-index:60;border-left:4px solid var(--msp-orange)}
.auth{max-width:440px;margin:40px auto}
.auth .card{text-align:center;padding:30px}
.neg{padding:8px 12px;border-radius:8px;margin:5px 0;font-size:12px;font-weight:600;border-left:3px solid}
.neg.hit{background:#FEE2E2;color:#991B1B;border-left-color:#DC2626}
.neg.okf{background:#DCFCE7;color:#166534;border-left-color:#16A34A}
.neg.warn{background:#FEF3C7;color:#92400E;border-left-color:#F59E0B}
.chk{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--msp-border);border-radius:8px;margin:3px 0;cursor:pointer;font-size:13px;transition:all .15s}
.chk:hover{border-color:var(--msp-blue);background:var(--msp-blue-light)}
.chk input{width:16px;height:16px;margin:0;accent-color:var(--msp-orange)}
.clink{color:var(--msp-blue);text-decoration:none;font-weight:600;margin-right:12px;display:inline-block;padding:2px 0;font-size:13px}
.clink:hover{color:var(--msp-orange)}
.prog-line{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--msp-border);border-radius:10px;margin:6px 0;font-size:13px;transition:all .15s}
.prog-line.yes{background:var(--msp-blue-light);border-color:var(--msp-blue);border-left:4px solid var(--msp-orange)}
.prog-line.no2{background:#FAFBFC}
.main-contact{background:linear-gradient(135deg,var(--msp-blue-light) 0%,#fff 100%);border:2px solid var(--msp-blue);border-radius:12px;padding:12px;margin:10px 0;position:relative;overflow:hidden}
.main-contact::before{content:'';position:absolute;top:0;right:0;width:60px;height:60px;background:var(--msp-orange);opacity:.08;border-radius:50%;transform:translate(30%,-30%)}
.main-contact b{color:var(--msp-blue);font-size:14px;position:relative}
.pwa-banner{background:linear-gradient(135deg,var(--msp-blue) 0%,var(--msp-orange) 100%);color:#fff;border-radius:12px;padding:14px;margin-bottom:14px;display:none;align-items:center;gap:12px;box-shadow:var(--msp-shadow-lg)}
.pwa-banner.show{display:flex}
.pwa-banner .close{background:rgba(255,255,255,.2);border:none;border-radius:50%;width:26px;height:26px;color:#fff;cursor:pointer;font-size:16px;line-height:1}
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.filter-drop{position:relative}
.filter-drop-btn{background:#fff;border:1.5px solid var(--msp-border);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;min-width:180px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:6px;color:var(--msp-text);transition:all .15s}
.filter-drop-btn:hover{border-color:var(--msp-blue);color:var(--msp-blue)}
.filter-drop-btn .cnt{background:var(--msp-orange);color:#fff;border-radius:999px;padding:1px 7px;font-size:10px;font-weight:700}
.filter-drop-btn .cnt.zero{background:#CBD5E1;color:#64748B}
.filter-drop-panel{position:absolute;top:100%;left:0;margin-top:6px;background:#fff;border:1.5px solid var(--msp-border);border-radius:10px;box-shadow:var(--msp-shadow-lg);z-index:40;min-width:300px;max-width:380px;max-height:340px;overflow-y:auto;padding:10px;display:none}
.filter-drop-panel.open{display:block;animation:dropIn .15s ease-out}
@keyframes dropIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.filter-drop-panel .chk{margin:2px 0;font-size:12px}
.filter-drop-panel .all-row{border-bottom:1.5px solid var(--msp-border);padding-bottom:6px;margin-bottom:6px}
.filter-drop-panel .all-row .chk{font-weight:700;color:var(--msp-blue)}
.history-cell{max-width:240px;font-size:11px;color:var(--msp-gray)}
.history-cell .h-toggle{color:var(--msp-blue);cursor:pointer;font-weight:700;font-size:11px;display:inline-flex;align-items:center;gap:4px}
.history-cell .h-toggle:hover{color:var(--msp-orange)}
.history-cell .h-list{display:none;margin-top:6px;padding:6px 8px;background:var(--msp-gray-light);border-radius:8px;max-height:220px;overflow-y:auto;border-left:3px solid var(--msp-orange)}
.history-cell .h-list.open{display:block}
.history-cell .h-item{margin:3px 0;line-height:1.35}
/* ===== Архив ===== */
.archive-badge{background:var(--msp-orange-light);color:var(--msp-orange);padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;margin-left:8px}
.archive-item{border-left:4px solid var(--msp-orange);background:linear-gradient(90deg,var(--msp-orange-light) 0%,#fff 40%)}
.archive-item:hover{background:linear-gradient(90deg,#FFE8D6 0%,#fff 40%)}
@media (max-width:640px){
  .wrap{padding:10px}
  .card{padding:12px;margin-bottom:10px}
  .row{gap:6px}
  input,select,textarea{font-size:13px;padding:8px 10px}
  .btn{padding:8px 12px;font-size:12px}
  table{font-size:11px}
  th,td{padding:6px 8px}
  .filter-drop-btn{min-width:140px;font-size:12px}
  .logo-text{font-size:16px}
}
</style>
</head>

<script>

var APP_NAME='Заявки <span style="color:var(--msp-orange)">УРМ</span>';

 {id:'MOSC',sheet:'8. Москва массовая',note:'Финансирование возможно только по основному ОКВЭД',allowAdd:false,

var BUILTIN_EXCL=S('01.21 05 06 07 08 09.10.3 11.01.4 11.02 11.03 11.04 11.05 11.07.2 12 19.2 20.14 29.1 29.10.2 30.91 45.1 46.17.2 46.71 46.72 46.76.4 47.11 47.2 47.25 47.26 47.3 47.99.3 92 19.20');

var PROG_KEY='urm_progs_v1';
var PROGRAMS=[],CUR_EXCL=BUILTIN_EXCL,FROM_FILE=false;
function cloneBuiltins(){return BUILTIN_PROGRAMS.map(function(p){return {id:p.id,sheet:p.sheet,note:p.note,allowAdd:!!p.allowAdd,setMain:new Set(p.main),setAdd:new Set(p.add),setExcl:new Set(p.excl)};});}
function loadPrograms(){
  try{var raw=localStorage.getItem(PROG_KEY);
    if(raw){var o=JSON.parse(raw);
      if(o&&o.progs&&o.progs.length){
        PROGRAMS=o.progs.map(function(p){return {id:p.id,sheet:p.sheet,note:p.note||'',allowAdd:!!p.allowAdd,setMain:new Set(p.main||[]),setAdd:new Set(p.add||[]),setExcl:new Set(p.excl||[])};});
        if(o.excl&&o.excl.length)CUR_EXCL=new Set(o.excl);
        FROM_FILE=!!o.fromFile;
        return;}}}catch(e){}
  PROGRAMS=cloneBuiltins();FROM_FILE=false;
}
function savePrograms(){
  localStorage.setItem(PROG_KEY,JSON.stringify({fromFile:FROM_FILE,progs:PROGRAMS.map(function(p){return {id:p.id,sheet:p.sheet,note:p.note,allowAdd:p.allowAdd,main:Array.from(p.setMain),add:Array.from(p.setAdd),excl:Array.from(p.setExcl)};}),excl:Array.from(CUR_EXCL)}));
}
function resetPrograms(){localStorage.removeItem(PROG_KEY);CUR_EXCL=BUILTIN_EXCL;PROGRAMS=cloneBuiltins();FROM_FILE=false;render();toast('Возвращена встроенная матрица');}
function matrixIsBuiltin(){return !FROM_FILE;}
loadPrograms();

function uid(){return 'id'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);}
function migrate(db){
  (db.users||[]).forEach(function(u){u.city=u.city||u.urm||'';u.region=u.region||'';});
  (db.companies||[]).forEach(function(c){c.contacts=c.contacts||[];c.apps=c.apps||[];c.neg=c.neg||[];c.okveds=c.okveds||[];
    c.contacts.forEach(function(ct){ct.primary=!!ct.primary;});
    (c.apps||[]).forEach(function(a){a.history=a.history||[];});
    if(c.archived&&!c.archivedAt)c.archivedAt=Date.now();
  });
  return db;
}
function load(){
  try{var raw=localStorage.getItem('urm_db_v2');if(raw)return migrate(JSON.parse(raw));}catch(e){}
  return migrate({users:[
    {id:'u1',login:'manager',pass:'manager',role:'manager',name:'Иванов Иван Иванович',city:'Москва',region:'Центральный федеральный округ (ЦФО)'},
    {id:'u2',login:'boss',pass:'boss',role:'boss',name:'Петров Пётр Петрович',city:'Москва',region:'Центральный федеральный округ (ЦФО)'}],
    companies:[seedCompany()],session:null});
}

  taxes:null,msp:null,support:[],analysis:null};}
var DB=load();
function save(){localStorage.setItem('urm_db_v2',JSON.stringify(DB));}
function currentUser(){return DB.session?DB.users.find(function(u){return u.id===DB.session.userId;})||null:null;}
function getCompany(id){return DB.companies.find(function(c){return c.id===id;});}
function mainCode(c){var o=(c.okveds||[]).find(function(x){return x.main;})||(c.okveds||[])[0];return o?o.code:'';}
function addCodes(c){return (c.okveds||[]).filter(function(x){return !x.main;}).map(function(x){return x.code;});}

function matchProg(code,set,excl){
  var p=String(code||'').trim();
  while(p){
    if(excl&&excl.has(p))return null;
    if(set.has(p))return p;
    var i=p.lastIndexOf('.');p=i>0?p.slice(0,i):'';
  }
  return null;
}
function matchHier(code,set){return matchProg(code,set,null);}
function programMatches(c){
  var main=mainCode(c),adds=addCodes(c),res=[];
  PROGRAMS.forEach(function(p){
    var m=matchProg(main,p.setMain,p.setExcl);
    if(m){res.push({prog:p,matched:m,via:'main'});return;}
    if(p.allowAdd){
      for(var i=0;i<adds.length;i++){
        var ma=matchProg(adds[i],p.setMain,p.setExcl);
        if(ma){res.push({prog:p,matched:ma,via:'add'});break;}
      }
    }
  });
  return res;
}
function isPreferential(c){return programMatches(c).length>0;}
function isExclude(code){return !!matchHier(code,CUR_EXCL);}

function sheetColor(wb,ws,idx){
  var c=null;
  try{c=c||ws['!tabcolor']||ws['!tabColor'];}catch(e){}
  try{var w=(wb.Workbook&&wb.Workbook.Sheets&&wb.Workbook.Sheets[idx])||null;
    if(w)c=c||w.Color||w.TabColor||w.tabColor;}catch(e){}
  if(!c)return null;
  var h=String(c).replace(/[^0-9a-fA-F]/g,'');
  if(h.length===8)h=h.slice(2);
  if(h.length<6)return null;
  return h.slice(0,6).toUpperCase();
}
function isYellowHex(h){
  if(!h)return false;
  var r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  return r>=200&&g>=150&&b<=120;
}
function prefixYellow(name){return /^[1-8]([.\s]|$)/.test(String(name||'').trim());}
function pickNote(r){
  for(var k=2;k<=4;k++){
    var v=String(r[k]||'').replace(/\s+/g,' ').trim();
    if(/финанс|оквэд|поручитель|цели|возмож/i.test(v))return v;
  }
  return '';
}
function handleOkvedFile(input){
  var f=input.files[0];if(!f)return;
  if(!window.XLSX){toast('Библиотека XLSX ещё не загрузилась, повторите через пару секунд');return;}
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var wb=XLSX.read(new Uint8Array(rd.result),{type:'array',cellStyles:true});
      var sheets=[],colorSeen=false;
      wb.SheetNames.forEach(function(sn,idx){
        var ws=wb.Sheets[sn];if(!ws)return;
        var col=sheetColor(wb,ws,idx);
        if(col)colorSeen=true;
        var rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''});
        var main=[],add=[],excl=[],note='';
        rows.forEach(function(r){
          var code=String(r[0]||'').trim();
          var b=String(r[1]||'').trim().toUpperCase();
          if(!/^\d{1,2}(\.\d{1,2}){0,3}$/.test(code))return;
          var nt=pickNote(r);
          if(b.indexOf('ДА/НЕТ')===0){add.push(code);if(nt&&!note)note=nt;}
          else if(b.indexOf('ДА')===0){main.push(code);if(nt&&!note)note=nt;}
          else if(b.indexOf('НЕТ')===0&&/нужно исключать/i.test(nt)){excl.push(code);}
        });
        if(main.length+add.length>=5){
          sheets.push({name:sn,color:col,note:note,main:main,add:add,excl:excl,
            pick:col?isYellowHex(col):prefixYellow(sn)});
        }
      });
      if(!sheets.length){toast('В файле не найдено листов с кодами ДА/НЕТ');return;}
      window._fileSheets=sheets;window._colorDetected=colorSeen;
      openSheetPicker();
    }catch(e){toast('Ошибка чтения файла: '+e.message);}
  };
  rd.readAsArrayBuffer(f);
}

var PROXIES=[
  function(u){return 'https://api.allorigins.win/raw?url='+encodeURIComponent(u);},

function bizErr(j,status){return new Error((j&&j.meta&&j.meta.message)||('Ошибка сервиса '+(status||'')));}
async function apiGet(path){
  var url=API_BASE+path+(path.indexOf('?')>=0?'&':'?')+'key='+encodeURIComponent(API_KEY);
  try{
    var r=await fetch(url);
    var j=null;try{j=await r.json();}catch(e){}
    if(j&&j.meta&&j.meta.status==='error')throw bizErr(j,j.meta.code||r.status);
    if(!r.ok||!j)throw new Error('HTTP '+r.status);
    return j;
  }catch(e){
    if(e&&e.biz)throw e;
    var last=e;
    for(var i=0;i<PROXIES.length;i++){
      try{
        var r2=await fetch(PROXIES[i](url));
        if(!r2.ok)throw new Error('HTTP '+r2.status);
        var j2=await r2.json();
        if(j2&&j2.meta&&j2.meta.status==='error')throw bizErr(j2,j2.meta.code||r2.status);
        return j2;
      }catch(e2){
        if(e2&&e2.biz)throw e2;
        last=e2;
      }
    }
    throw last;
  }
}

function parseFinReport(j){
  var years={},links={};
  if(!j||typeof j!=='object')return {years:years,links:links};
  var roots=[j.data,j['finance'],j['finances'],j['Финансы'],j['БухгалтерскаяОтчетность'],j['Отчетность'],j];
  roots.forEach(function(o){
    if(!o||typeof o!=='object')return;
    Object.keys(o).forEach(function(k){
      if(!/^(19|20)\d{2}$/.test(k))return;
      var v=o[k];
      if(!v||typeof v!=='object'||Array.isArray(v))return;
      var ks=Object.keys(v);if(!ks.length)return;
      var isLinks=ks.every(function(kk){return typeof v[kk]==='string'&&v[kk].indexOf('http')===0;});
      if(isLinks){ks.forEach(function(kk){if(!links[kk])links[kk]=v[kk];});}
      else if(!years[k])years[k]=v;
    });
  });
  var bo=j['bo.nalog.ru']||j['bo_nalog_ru']||null;
  if(bo&&bo['Отчет']&&typeof bo['Отчет']==='object'){
    Object.keys(bo['Отчет']).forEach(function(y){if(!links[y])links[y]=bo['Отчет'][y];});
  }
  return {years:years,links:links};
}
function fg(f,codes){
  if(!f)return null;
  for(var i=0;i<codes.length;i++){var v=num(f[codes[i]]);if(v!=null)return v;}
  return null;
}
function calcFin(f){
  var o={};
  o.rev=fg(f,['2110']);o.cogs=fg(f,['2120']);o.gross=fg(f,['2100']);o.ebit=fg(f,['2200']);
  o.pretax=fg(f,['2300']);o.tax=fg(f,['2410']);o.net=fg(f,['2400']);o.int=fg(f,['2330']);
  o.depr=fg(f,['Амортизация','AMORT','DEPR']);
  o.nca=fg(f,['1100']);o.fa=fg(f,['1150']);o.inv=fg(f,['1210']);o.recv=fg(f,['1230']);o.cash=fg(f,['1250']);o.ca=fg(f,['1200']);
  o.assets=fg(f,['1600']);o.equity=fg(f,['1300']);o.ltl=fg(f,['1400']);o.bL=fg(f,['1410','1450']);
  o.stl=fg(f,['1500']);o.bS=fg(f,['1510','1520']);
  o.ebitda=(o.pretax!=null)?o.pretax:((o.net!=null&&o.tax!=null)?o.net+Math.abs(o.tax):null);
  if(o.ebitda!=null){
    if(o.int!=null)o.ebitda+=Math.abs(o.int);
    if(o.depr!=null)o.ebitda+=Math.abs(o.depr);
  }
  o.hasDepr=o.depr!=null;
  o.debt=(o.bL!=null||o.bS!=null)?((o.bL||0)+(o.bS||0)):null;
  o.netDebt=(o.debt!=null)?o.debt-(o.cash||0):null;
  o.cr=div(o.ca,o.stl);
  o.qr=div((o.ca!=null&&o.inv!=null)?(o.ca-o.inv):o.ca,o.stl);
  o.ar=div(o.cash,o.stl);
  o.aut=div(o.equity,o.assets);
  o.d2e=div((o.ltl!=null&&o.stl!=null)?(o.ltl+o.stl):null,o.equity);
  o.npm=div(o.net,o.rev);o.gm=div(o.gross,o.rev);o.roa=div(o.net,o.assets);o.roe=div(o.net,o.equity);o.at=div(o.rev,o.assets);
  o.em=div(o.ebitda,o.rev);
  o.de=div(o.debt,o.ebitda);o.nde=div(o.netDebt,o.ebitda);
  return o;
}

    if(!Object.keys(years).length)err='сервис не вернул данные отчётности для этого ИНН';
  }catch(e){err=e.message||'сервис недоступен';}
  try{
    var j2=await apiGet('company?inn='+c.inn);
    var n=normCompany(j2);
    c.taxes=n.taxes;c.msp=n.msp;c.support=n.support;
    if(n.sredsp!=null){c.sredsp=n.sredsp;c.sredspYear=n.sredspYear;}
  }catch(e){if(!err)err='данные организации частично недоступны';}

}
function conclusionHtml(o,p,c){
  var items=[];
  function add(cls,txt){items.push('<div class="neg '+(cls==='r'?'hit':cls==='g'?'okf':'warn')+'">'+txt+'</div>');}
  if(o.equity!=null){(o.equity<0)?add('r','⚠️ Отрицательный капитал: '+fm(o.equity)+' тыс. ₽'):add('g','✔️ Собственный капитал положительный: '+fm(o.equity)+' тыс. ₽');}
  if(o.aut!=null){
    if(o.aut>=0.5)add('g','✔️ Финансовая автономия '+fmtR(o.aut)+' (норма ≥ 0,5)');
    else if(o.aut>=0.3)add('y','⚠️ Автономия '+fmtR(o.aut)+' ниже нормы (≥ 0,5)');
    else add('r','⚠️ Низкая автономия: '+fmtR(o.aut)+' (норма ≥ 0,5)');
  }
  if(o.cr!=null){
    if(o.cr>=2)add('g','✔️ Текущая ликвидность '+fmtR(o.cr)+' (норма ≥ 2)');
    else if(o.cr>=1.2)add('y','⚠️ Текущая ликвидность '+fmtR(o.cr)+' ниже нормы (≥ 2)');
    else add('r','⚠️ Низкая текущая ликвидность: '+fmtR(o.cr));
  }
  if(o.ebitda!=null){
    if(o.ebitda>0)add('g','✔️ EBITDA положительная: '+fm(o.ebitda)+' тыс. ₽ (маржа '+pct(o.em)+')');
    else add('r','️ EBITDA отрицательная: '+fm(o.ebitda)+' тыс. ₽');
    if(o.ebitda>0&&o.de!=null){
      if(o.de<=3)add('g','✔️ Долг / EBITDA = '+fmtR(o.de)+' (норма ≤ 3)');
      else if(o.de<=4)add('y','⚠️ Долг / EBITDA = '+fmtR(o.de)+' — выше нормы (≤ 3)');
      else add('r','️ Высокая долговая нагрузка: Долг / EBITDA = '+fmtR(o.de));
    }else if(o.ebitda<=0){add('r','⚠️ Долг / EBITDA не рассчитывается (EBITDA ≤ 0)');}
  }
  if(o.net!=null){(o.net>0)?add('g','✔️ Чистая прибыль: '+fm(o.net)+' тыс. ₽'):add('r','⚠️ Убыток: '+fm(o.net)+' тыс. ₽');}
  if(p&&p.rev!=null&&o.rev!=null&&p.rev!==0){
    var d=(o.rev-p.rev)/Math.abs(p.rev)*100;
    if(d>=0)add('g','✔️ Выручка растёт: '+pct(d/100)+' г/г');
    else if(d>=-10)add('y','⚠️ Выручка снизилась: '+pct(d/100)+' г/г');
    else add('r','⚠️ Существенное падение выручки: '+pct(d/100)+' г/г');
  }
  var t=c.taxes||{};
  if(t.arrears!=null){(t.arrears>0)?add('r','⚠️ Недоимка по налогам: '+fmtNum(t.arrears)+' ₽'):add('g','✔️ Недоимки по налогам нет (по данным ФНС)');}
  if(!items.length)return '<div class="mut">Недостаточно данных для заключения.</div>';
  return items.join('');
}

function render(){

    if(u.role==='boss')app.innerHTML=topbar(u)+viewSettingsBoss(u);

function doRegister(e){e.preventDefault();
  var g=function(id){return document.getElementById(id).value.trim();};
  var last=g('rg-last'),first=g('rg-first'),patr=g('rg-patr');
  var city=g('rg-city'),region=g('rg-region'),lg=g('rg-lg'),pw=g('rg-pw'),role=document.getElementById('rg-role').value;
  if(!last||!first||!patr){toast('Заполните Фамилию, Имя и Отчество полностью');return false;}

  if(DB.users.find(function(x){return x.login===lg;})){toast('Логин занят');return false;}
  var nm=last+' '+first+' '+patr;
  DB.users.push({id:uid(),login:lg,pass:pw,role:role,name:nm,city:city,region:region});
  DB.session={userId:DB.users[DB.users.length-1].id};save();state.view='home';render();
  toast('Аккаунт создан: '+roleTitle(role));return false;}

function appPairs(u){
  var pairs=[];

  var f=state.boss;
  return pairs.filter(function(p){
    if(f.statuses.length&&f.statuses.indexOf(p.a.status)<0)return false;
    if(f.programs.length&&f.programs.indexOf(p.a.program)<0)return false;
    if(f.regions.length&&f.regions.indexOf(mgrRegion(p.c.managerId))<0)return false;
    if(f.mode==='urm'&&f.urms.length&&f.urms.indexOf(mgrCity(p.c.managerId))<0)return false;

    var q=f.q.toLowerCase();
    if(q&&(p.c.name||'').toLowerCase().indexOf(q)<0&&(p.c.inn||'').indexOf(q)<0)return false;

function saveEditApp(aid){
  var c=getCompany(state.cid);
  var a=c.apps.find(function(x){return x.id===aid;});
  if(!a)return;
  var sum=parseFloat(document.getElementById('ed-sum').value);
  if(!(sum>0)){toast('Укажите сумму');return;}
  var changes=[];
  if(a.sum!==sum)changes.push('сумма: '+fmtMoney(a.sum)+' → '+fmtMoney(sum));
  if(a.term!==parseInt(document.getElementById('ed-term').value,10))changes.push('срок: '+a.term+' → '+document.getElementById('ed-term').value+' мес');
  if(a.program!==document.getElementById('ed-prog').value)changes.push('программа изменена');
  if(a.target!==document.getElementById('ed-target').value)changes.push('цель: '+a.target+' → '+document.getElementById('ed-target').value);
  if(a.status!==document.getElementById('ed-status').value)changes.push('статус: '+stName(a.status)+' → '+stName(document.getElementById('ed-status').value));
  a.sum=sum;
  a.term=parseInt(document.getElementById('ed-term').value,10)||12;
  a.program=document.getElementById('ed-prog').value;
  a.programName=progNameById(a.program);
  a.target=document.getElementById('ed-target').value;
  a.empEmail=document.getElementById('ed-ee').value.trim();
  a.empPhone=document.getElementById('ed-ep').value.trim();
  a.status=document.getElementById('ed-status').value;
  a.history=a.history||[];
  if(changes.length)a.history.push({action:'Заявка отредактирована',author:currentUser().name,dt:Date.now(),details:changes.join('; ')});
  var cmtText=document.getElementById('ed-cmt').value.trim();
  if(cmtText){
    a.comments=a.comments||[];
    a.comments.push({id:uid(),author:currentUser().name,text:cmtText,dt:Date.now()});
    a.history.push({action:'Добавлен комментарий',author:currentUser().name,dt:Date.now(),details:cmtText});
  }
  save();closeModal();render();toast('Заявка обновлена');
}

async function queryCheck(){
  var inn=document.getElementById('nc-inn').value.trim();
  var out=document.getElementById('nc-out');var negBox=document.getElementById('nc-neg');
  if(!/^\d{10,15}$/.test(inn)){out.textContent='ИНН: 10 или 12 цифр';return;}
  out.textContent='Запрашиваем данные…';negBox.innerHTML='';
  var j;
  try{j=await apiGet('company?inn='+inn);}
  catch(err){out.textContent='Не удалось получить данные: '+err.message+'. Заполните поля вручную.';
    window._neg=defaultNeg('проверка недоступна');negBox.innerHTML=negHtml(window._neg);return;}
  var n=normCompany(j);
  if(!n.name&&!n.inn){out.textContent='Компания не найдена по ИНН.';return;}
  window._norm=n;
  document.getElementById('nc-name').value=n.name;document.getElementById('nc-addr').value=n.address;
  document.getElementById('nc-kpp').value=n.kpp;document.getElementById('nc-ogrn').value=n.ogrn;
  document.getElementById('nc-cap').value=n.capital;document.getElementById('nc-em').value=n.emails.join(', ');
  document.getElementById('nc-ph').value=n.phones.join(', ');document.getElementById('nc-okv').value=n.okvedMain;
  document.getElementById('nc-okvadd').value=n.okveds.filter(function(o){return !o.main;}).map(function(o){return o.code;}).join(', ');
  out.textContent='Данные получены. Проверяем негатив-факторы…';
  negBox.innerHTML='<div class="mut">Проверка негатив-факторов…</div>';
  var neg;
  try{neg=await fetchNegFactors(inn,j.data);}catch(e){neg=defaultNeg('проверка недоступна');}
  window._neg=neg;negBox.innerHTML=negHtml(neg);
  out.textContent='Данные получены';
}
async function refreshChecko(silent){

    if(n.capital)c.capital=n.capital;if(n.emails.length)c.emails=n.emails;if(n.phones.length)c.phones=n.phones;

    c.mgmt=n.mgmt||c.mgmt;c.region=n.region||c.region;c.founded=n.founded||c.founded;

function createCompany(e){e.preventDefault();
  var u=currentUser();
  var inn=document.getElementById('nc-inn').value.trim();
  if(!/^\d{10,15}$/.test(inn)){toast('ИНН: 10 или 12 цифр');return false;}
  var existing=DB.companies.find(function(c){return c.inn===inn;});
  if(existing){
    var creator=mgrName(existing.managerId);
    var statusText=existing.archived?' (в архиве)':'';
    toast('Компания с ИНН '+inn+' уже создана: '+esc(existing.name)+' — сотрудник '+creator+statusText);
    return false;
  }
  var g=function(id){return document.getElementById(id).value.trim();};
  var okvs=[{code:g('nc-okv'),main:true,name:''}];
  g('nc-okvadd').split(/[,;\s]+/).filter(function(x){return x;}).forEach(function(k){okvs.push({code:k,main:false,name:''});});
  var mid=(u.role==='manager'||u.role==='director')?u.id:((scopedManagers()[0]||u).id);
  var n=window._norm;
  var c={id:uid(),inn:inn,name:g('nc-name'),kpp:g('nc-kpp'),ogrn:g('nc-ogrn'),address:g('nc-addr'),capital:g('nc-cap'),
    emails:g('nc-em').split(/[,;]+/).map(function(s){return s.trim();}).filter(function(s){return s;}),
    phones:g('nc-ph').split(/[,;]+/).map(function(s){return s.trim();}).filter(function(s){return s;}),
    okveds:okvs,managerId:mid,archived:false,archivedAt:null,createdAt:Date.now(),contacts:[],apps:[],neg:window._neg||[],namesTried:true,
    mgmt:'',region:'',founded:'',sredsp:null,sredspYear:'',taxes:null,msp:null,support:[],analysis:null};
  if(n&&n.inn===inn){
    c.mgmt=n.mgmt;c.region=n.region;c.founded=n.founded;c.sredsp=n.sredsp;c.sredspYear=n.sredspYear;
    if(n.okvedMain)c.okveds=n.okveds;
    c.contacts=autoContacts(n);
    c.taxes=n.taxes;c.msp=n.msp;c.support=n.support;
  }
  DB.companies.push(c);save();closeModal();openCompany(c.id);toast('Компания создана');return false;}

    '<div class="row"><div><label>УРМ г. *</label><input id="am-city" required autocomplete="off"></div>'+

function changePass(e){e.preventDefault();var u=currentUser();
  if(document.getElementById('cp-old').value!==u.pass){toast('Старый пароль неверен');return false;}
  u.pass=document.getElementById('cp-new').value;save();render();toast('Пароль изменён');return false;}
function addManager(e){e.preventDefault();
  var g=function(id){return document.getElementById(id).value.trim();};
  var last=g('am-last'),first=g('am-first'),patr=g('am-patr');
  if(!last||!first||!patr){toast('Заполните Фамилию, Имя и Отчество полностью');return false;}
  var lg=g('am-lg');
  if(DB.users.find(function(x){return x.login===lg;})){toast('Логин занят');return false;}
  DB.users.push({id:uid(),login:lg,pass:g('am-pw'),role:document.getElementById('am-role').value,name:last+' '+first+' '+patr,city:g('am-city'),region:g('am-region')});
  save();render();toast('Сотрудник добавлен');return false;}
function delManager(id){if(!confirm('Удалить сотрудника?'))return;
  DB.users=DB.users.filter(function(x){return x.id!==id;});
  DB.companies.forEach(function(c){if(c.managerId===id)c.managerId=null;});
  save();render();}
function exportRows(rows,fname){
  if(window.XLSX){
    var ws=XLSX.utils.aoa_to_sheet(rows);
    var widths=rows[0].map(function(_,i){
      var m=10;
      rows.forEach(function(r){var v=r[i]==null?'':String(r[i]);if(v.length>m)m=v.length;});
      return {wch:Math.min(45,m+2)};});
    ws['!cols']=widths;
    var wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'Отчёт');
    XLSX.writeFile(wb,fname+'.xlsx');
  }else{
    var csv='\uFEFF'+rows.map(function(r){
      return r.map(function(x){return '"'+String(x==null?'':x).replace(/"/g,'""')+'"';}).join(';');}).join('\n');
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    a.download=fname+'.csv';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
  }
}
function buildAppsRows(u){
  var pairs=appPairs(u);
  var rows=[['Компания','ИНН','Осн. ОКВЭД','Соответствие льготным программам','Программа заявки','Целевое использование','Сумма','Срок (мес)','Статус','Сотрудник','УРМ','Регион','E-mail аналитика','Тел. аналитика','Создана','Комментарии','История изменений']];
  pairs.forEach(function(p){
    var mm=programMatches(p.c).map(function(x){return x.prog.sheet+(x.via==='add'?' (доп. ОКВЭД)':'');}).join('; ');
    var comments=(p.a.comments||[]).map(function(cm){return cm.author+': '+cm.text;}).join(' | ');
    var history=(p.a.history||[]).map(function(h){return fmtDateTime(h.dt)+' '+h.author+': '+h.action+(h.details?' ('+h.details+')':'');}).join('; ');
    rows.push([p.c.name,p.c.inn,mainCode(p.c),mm||'—',p.a.programName||progNameById(p.a.program),p.a.target||'',p.a.sum,p.a.term,stName(p.a.status),
      mgrName(p.c.managerId),mgrCity(p.c.managerId),mgrRegion(p.c.managerId),p.a.empEmail||'',p.a.empPhone||'',fmtDate(p.a.createdAt),comments,history]);});
  return rows;
}
function exportApps(){
  var u=currentUser();
  var rows=buildAppsRows(u);
  if(rows.length<=1){toast('Нет данных для отчёта');return;}
  exportRows(rows,'Заявки_УРМ_'+new Date().toISOString().slice(0,10));
  toast('Отчёт выгружен');
}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.style.display='block';
  clearTimeout(t._h);t._h=setTimeout(function(){t.style.display='none';},2600);}
function makeIcon(){
  var cv=document.createElement('canvas');cv.width=cv.height=64;var x=cv.getContext('2d');
  x.fillStyle='#0055A5';x.fillRect(0,0,64,64);
  x.fillStyle='#F26522';
  x.fillRect(8,40,14,16);
  x.fillRect(25,28,14,28);
  x.fillRect(42,16,14,40);
  x.fillRect(42,4,14,12);
  var url=cv.toDataURL('image/png');
  var l=document.createElement('link');l.rel='icon';l.href=url;document.head.appendChild(l);
  var a=document.createElement('link');a.rel='apple-touch-icon';a.href=url;document.head.appendChild(a);
  return url;
}
function initPWA(icon){
  try{
    var mf={name:APP_NAME_PLAIN,short_name:'УРМ',start_url:'.',display:'standalone',
      background_color:'#F5F7FA',theme_color:'#0055A5',icons:[{src:icon,sizes:'64x64',type:'image/png'}]};
    var l=document.createElement('link');l.rel='manifest';
    l.href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:'application/json'}));
    document.head.appendChild(l);
  }catch(e){}
  if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
}
var ICON=makeIcon();
initPWA(ICON);
render();
</script>
